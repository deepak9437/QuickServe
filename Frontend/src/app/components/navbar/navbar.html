<header [class.scrolled]="scrolled()">
  <nav class="container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <span class="logo-icon">🏡</span>
      <span class="logo-text">Local<strong>Serve</strong></span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen()">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a></li>
      <li><a routerLink="/providers" routerLinkActive="active" (click)="closeMenu()">Providers</a></li>
      <li><a href="#how-it-works" (click)="closeMenu()">How It Works</a></li>
    </ul>

    <div class="nav-actions">
      @if (authService.isLoggedIn()) {
        <span class="user-greeting">
          Hi, {{ authService.currentUser()?.firstName }}
        </span>
        <button class="btn-outline" (click)="logout()">Sign Out</button>
      } @else {
        <button class="btn-outline">Sign In</button>
        <button class="btn-primary">Post a Job</button>
      }
    </div>

    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
      <span></span><span></span><span></span>
    </button>
  </nav>
</header>

<nav class="navbar">
  <div class="logo">Quick<span>Serve</span></div>

  <ul class="nav-links">
    <li>
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>
    </li>

    <li>
      <a routerLink="/services" routerLinkActive="active"> Services </a>
    </li>

    <li>
      <a routerLink="/provider-register" routerLinkActive="active">
        Become Provider
      </a>
    </li>

    <!-- Not Logged In -->
    @if (!user) {
    <li>
      <a routerLink="/login">Login</a>
    </li>

    <li>
      <a routerLink="/signup" class="signup-btn"> Sign Up </a>
    </li>
    }

    <!-- Logged In -->
    @if (user) {
    <li class="profile-menu">
      <div class="profile-icon" (click)="toggleMenu()">👤</div>

      @if (showMenu) {
      <div class="dropdown">
        <p>{{ user.fullName }}</p>

        <a routerLink="/view-profile"> View Profile </a>

        @if (user.role === 'costumer') {
        <a routerLink="/dashboard"> Dashboard </a>
        } @if (user.role === 'provider') {
        <a routerLink="/provider-dashboard"> Dashboard </a>
        }

        <button (click)="logout()">Logout</button>
      </div>
      }
    </li>
    }
  </ul>
</nav>

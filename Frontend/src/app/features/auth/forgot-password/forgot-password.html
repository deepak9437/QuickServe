<div class="forgot-container">
  <div class="forgot-card">
    <h2>Forgot Password</h2>

    <p>Reset your QuickServe account password</p>

    @if(currentStep === 1){

    <div class="form-group">
      <label>Email Address</label>

      <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
    </div>

    <button class="action-btn" (click)="sendOtp()">Send OTP</button>

    } @if(currentStep === 2){

    <div class="form-group">
      <label>Enter OTP</label>

      <input type="text" [(ngModel)]="otp" placeholder="Enter OTP" />
    </div>

    <button class="action-btn" (click)="verifyOtp()">Verify OTP</button>

    } @if(currentStep === 3){

    <div class="form-group">
      <label>New Password</label>

      <input
        type="password"
        [(ngModel)]="newPassword"
        placeholder="Enter new password"
      />
    </div>

    <div class="form-group">
      <label>Confirm Password</label>

      <input
        type="password"
        [(ngModel)]="confirmPassword"
        placeholder="Confirm password"
      />
    </div>

    <button class="action-btn" (click)="resetPassword()">Reset Password</button>

    }
  </div>
</div>

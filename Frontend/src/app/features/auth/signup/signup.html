<div class="signup-container">
  <div class="signup-card">
    <h2>Create Account</h2>
    <p>Join QuickServe and book trusted local professionals.</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          name="fullName"
          [(ngModel)]="user.fullName"
          placeholder="Enter your name"
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="user.userEmail"
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          type="text"
          name="phone"
          [(ngModel)]="user.userPhone"
          placeholder="Enter phone number"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="user.password"
          placeholder="Enter password"
        />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="user.confirmPassword"
          placeholder="Confirm password"
        />
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select name="gender" [(ngModel)]="user.gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea rows="3" name="address" [(ngModel)]="user.address"></textarea>
      </div>

      <div class="form-group">
        <label>Pincode</label>
        <input
          type="number"
          name="pincode"
          [(ngModel)]="user.pincode"
          placeholder="Enter pincode"
        />
      </div>

      <button type="submit" class="signup-btn">Create Account</button>
    </form>

    <div class="login-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>
  </div>
</div>

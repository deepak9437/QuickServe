<div class="provider-container">
  <div class="provider-card">
    <h2>Become a Service Provider</h2>
    <p>Join QuickServe and grow your business.</p>

    <form (ngSubmit)="onSubmit()">
      <!-- Personal Information -->

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          name="fullName"
          [(ngModel)]="provider.fullName"
          placeholder="Enter your full name"
        />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="userEmail"
          [(ngModel)]="provider.userEmail"
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          type="text"
          name="userPhone"
          [(ngModel)]="provider.userPhone"
          placeholder="Enter phone number"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="provider.password"
          placeholder="Create password"
        />
      </div>

      <div class="form-group">
        <label>Gender</label>
        <select name="gender" [(ngModel)]="provider.gender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea
          rows="3"
          name="address"
          [(ngModel)]="provider.address"
          placeholder="Enter your address"
        ></textarea>
      </div>

      <div class="form-group">
        <label>Pincode</label>
        <input
          type="number"
          name="pincode"
          [(ngModel)]="provider.pincode"
          placeholder="Enter pincode"
        />
      </div>

      <hr />

      <!-- Professional Information -->

      <h3>Professional Information</h3>

      <div class="form-group">
        <label>Skills</label>

        <select name="skills" [(ngModel)]="provider.skills">
          <option value="">Select Skill</option>
          <option value="Electrician">Electrician</option>
          <option value="Plumber">Plumber</option>
          <option value="Cleaner">Cleaner</option>
          <option value="Carpenter">Carpenter</option>
          <option value="Painter">Painter</option>
          <option value="AC Technician">AC Technician</option>
          <option value="Home Tutor">Home Tutor</option>
          <option value="Gardener">Gardener</option>
          <option value="Mechanic">Mechanic</option>
        </select>
      </div>

      <div class="form-group">
        <label>Experience (Years)</label>
        <input
          type="number"
          name="experience"
          [(ngModel)]="provider.experience"
          placeholder="Enter experience"
        />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          rows="4"
          name="description"
          [(ngModel)]="provider.description"
          placeholder="Tell customers about your experience and services"
        ></textarea>
      </div>

      <hr />

      <!-- Verification Documents -->

      <h3>Verification Documents</h3>

      <div class="form-group">
        <label>Document Type</label>
        <select name="documentType" [(ngModel)]="provider.documentType">
          <option value="">Select Document</option>
          <option value="Aadhaar Card">Aadhaar Card</option>
          <option value="PAN Card">PAN Card</option>
          <option value="Driving License">Driving License</option>
          <option value="Voter ID">Voter ID</option>
        </select>
      </div>

      <div class="form-group">
        <label>Upload Document</label>
        <input type="file" (change)="onDocumentChange($event)" />
      </div>

      <div class="form-group">
        <label>Upload Certificate</label>
        <input type="file" (change)="onCertificateChange($event)" />
      </div>

      <div class="form-group">
        <label>Extra Certificate (Optional)</label>
        <input type="file" (change)="onExtraCertificateChange($event)" />
      </div>

      <button class="provider-btn" type="submit">Submit for Approval</button>
    </form>
  </div>
</div>

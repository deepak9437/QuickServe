<section class="dashboard">

  <div class="dashboard-header">

    <div>
      <h1>
        Welcome, {{provider.user?.fullName}} 👋
      </h1>

      <p>
        Manage your services and bookings.
      </p>
    </div>

    <button
      class="profile-btn"
      (click)="viewProfile()">

      My Profile

    </button>

  </div>

  <div class="stats-grid">

    <div class="stat-card">
      <h2>{{provider.experience}}</h2>
      <p>Years Experience</p>
    </div>

    <div class="stat-card">
      <h2>{{provider.review}}</h2>
      <p>Total Reviews</p>
    </div>

    <div class="stat-card">
      <h2>{{provider.availability ? 'Yes' : 'No'}}</h2>
      <p>Available</p>
    </div>

    <div class="stat-card">
      <h2>{{provider.skills}}</h2>
      <p>Skill</p>
    </div>

  </div>

  <div class="dashboard-section">

    <h2>Recent Activities</h2>

    <div
      class="activity-card"
      *ngFor="let activity of recentActivities">

      {{activity}}

    </div>

  </div>

  <button
    class="logout-btn"
    (click)="logout()">

    Logout

  </button>

</section>

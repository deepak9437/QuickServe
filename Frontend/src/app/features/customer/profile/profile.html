<section class="profile-container">

  <div class="profile-card">

    <img
      [src]="user.profilePic || 'assets/profile.png'"
      class="profile-image">

    <h2>{{user.fullName}}</h2>

    <p>{{user.userEmail}}</p>

    <div class="profile-details">

      <div>
        <strong>Phone</strong>
        <p>{{user.userPhone}}</p>
      </div>

      <div>
        <strong>Address</strong>
        <p>{{user.address}}</p>
      </div>

      <div>
        <strong>Gender</strong>
        <p>{{user.gender}}</p>
      </div>

    </div>

    <button
      class="edit-btn"
      (click)="editProfile()">

      Edit Profile

    </button>

  </div>

</section>

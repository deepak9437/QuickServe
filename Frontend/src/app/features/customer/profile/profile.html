<div class="profile-container">
  <div class="profile-card">
    <div class="profile-avatar">
      {{ profileData.fullName.charAt(0).toUpperCase() }}
    </div>

    <h2>My Profile</h2>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="profileData.fullName" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="profileData.userEmail" readonly />
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" [(ngModel)]="profileData.userPhone" />
    </div>

    <div class="form-group">
      <label>Address</label>
      <textarea rows="3" [(ngModel)]="profileData.address"> </textarea>
    </div>

    <div class="form-group">
      <label>Pincode</label>
      <input type="number" [(ngModel)]="profileData.pincode" />
    </div>

    <button class="update-btn" (click)="updateProfile()">Update Profile</button>
  </div>
</div>

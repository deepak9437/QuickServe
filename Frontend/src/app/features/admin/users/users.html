<div class="users-container">
  <div class="page-header">
    <h1>Manage Users</h1>
    <p>View all registered customers</p>
  </div>

  @if (users.length > 0) { @for (user of users; track user.id) {

  <div class="user-card">
    <div class="user-info">
      <h3>{{ user.fullName }}</h3>

      <p>
        <strong>Email:</strong>
        {{ user.userEmail }}
      </p>

      <p>
        <strong>Phone:</strong>
        {{ user.userPhone }}
      </p>

      <p>
        <strong>Address:</strong>
        {{ user.address }}
      </p>
    </div>
  </div>

  } } @else {

  <div class="no-data">
    <h3>No Users Found</h3>
  </div>

  }
</div>

<!-- ============ SIDEBAR ============ -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <i class="bi bi-shield-fill-check"></i>
    </div>
    <span class="logo-text">QuickServe</span>
  </div>

  <nav class="sidebar-nav">
    <a
      class="nav-item"
      routerLink="/admin/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-house-fill"></i>
      Dashboard
    </a>

    <a
      class="nav-item"
      routerLink="/admin/users"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-people"></i>
      Users
    </a>

    <a
      class="nav-item"
      routerLink="/admin/providers"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-person-badge"></i>
      Providers
    </a>

    <a
      class="nav-item"
      routerLink="/admin/bookings"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-calendar2-check"></i>
      Bookings
    </a>

    <a
      class="nav-item"
      routerLink="/admin/services"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-grid-3x3-gap"></i>
      Services
    </a>

    <a
      class="nav-item"
      routerLink="/admin/payments"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-credit-card"></i>
      Payments
    </a>

    <a
      class="nav-item"
      routerLink="/admin/reviews"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-star"></i>
      Reviews
    </a>

    <a
      class="nav-item"
      routerLink="/admin/reports"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-bar-chart-line"></i>
      Reports
    </a>

    <a
      class="nav-item"
      routerLink="/admin/settings"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <i class="bi bi-gear"></i>
      Settings
    </a>
  </nav>

  <div class="sidebar-promo">
    <p class="promo-title">Manage your platform efficiently and grow more!</p>
    <button class="promo-btn" (click)="goToReports()">
      View Reports <i class="bi bi-arrow-right"></i>
    </button>
    <div class="promo-illustration">
      <i class="bi bi-laptop"></i>
    </div>
  </div>

  <!-- <div class="sidebar-profile">
    <div class="profile-avatar">A</div>
    <div class="profile-info">
      <p class="profile-name">Admin</p>
      <p class="profile-role">Super Admin</p>
    </div>
    <i class="bi bi-chevron-down"></i>
  </div> -->
</aside>
